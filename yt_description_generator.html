<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTube説明文ジェネレーター</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    textarea {
      width: 100%;
      height: 80px;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
      margin-right: 10px;
    }
    #output {
      white-space: pre-wrap;
      margin-top: 20px;
      background: #f5f5f5;
      padding: 15px;
    }
  </style>
</head>
<body>

<h2>YouTube説明文ジェネレーター</h2>

<label>ハッシュタグ ※間に空白が必須</label>
<div style="font-size: 12px; color: gray; margin-bottom: 5px;">
  例: 格安　お得　ぼっち旅 女ひとり旅 一人旅
</div>
<textarea id="hashtag" placeholder="ハッシュタグを入力"></textarea>

<label>関連動画</label>
<div style="font-size: 12px; color: gray; margin-bottom: 5px;">
  例: ▼この動画の前編はこちら<br>
  https://youtu.be/9wQKzBq3-sI?si=5AbfzoXrwk2uwnYN
</div>
<textarea id="field1" placeholder="関連動画を入力"></textarea>

<label>フリーテキスト</label>
<div style="font-size: 12px; color: gray; margin-bottom: 5px;">
  例: サンライズ出雲 倉敷駅 22:14 → 東京駅 翌7:08
</div>
<textarea id="field2" placeholder="フリーテキストを入力"></textarea>

<label>♬*.:*¸¸bgm</label>
<textarea id="field3" placeholder="bgmを入力"></textarea>

<button onclick="generateText()">説明文を作成する</button>
<button onclick="copyToClipboard()">コピー</button>

<div id="output"></div>

<script>
function generateText() {
  const tagInput = document.getElementById("hashtag").value.trim();
  const f1 = document.getElementById("field1").value.trim();
  const f2 = document.getElementById("field2").value.trim();
  const f3 = document.getElementById("field3").value.trim();

  if (!f3) {
    alert("bgmを入力してください");
    return;
  }

  const divider = "┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈";
  const mandatoryText = `ご視聴ありがとうございます。
高評価とチャンネル登録していただければ喜びます♡`;

  let result = "";

  if (f1) {
    result += f1 + "\n";
    result += divider + "\n";
  }

  if (f2) {
    result += f2 + "\n";
    result += divider + "\n";
  }

  result += mandatoryText + "\n\n";
  result += "♬*.:*¸¸bgm\n" + f3;

  // ハッシュタグ生成（半角・全角スペース対応）
  if (tagInput) {
    const hashtags = tagInput
      .split(/\s|　/g)   // 半角スペース or 全角スペースで分割
      .filter(t => t.length > 0)
      .map(t => "#" + t)
      .join(" ");
    result += "\n\n" + hashtags;
  }

  document.getElementById("output").textContent = result;
}

function copyToClipboard() {
  const output = document.getElementById("output").textContent;
  if (!output) {
    alert("説明文がありません");
    return;
  }
  navigator.clipboard.writeText(output).then(() => {
    alert("説明文をコピーしました");
  });
}
</script>

</body>
</html>
