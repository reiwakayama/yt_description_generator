<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTube説明文ジェネレーター</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    textarea {
      width: 100%;
      height: 80px;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 15px;
      width: 75px;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
      text-align: center;
    }
    #output, #hashtagsOutput, #outputEn, #bgmLinks {
      white-space: pre-wrap;
      margin-top: 20px;
      background: #f5f5f5;
      padding: 15px;
    }
    #bgmLinks {
      margin-top: 0;
    }
    label.checkbox-label {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      font-weight: normal;
    }
    label.checkbox-label input {
      margin-right: 10px;
    }
    .line-break {
      margin-top: 10px;
    }
    table input {
      width: 100%;
      border: none;
      padding: 5px;
      box-sizing: border-box;
    }
    th, td {
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

<h2>YouTube説明文ジェネレーター</h2>

<label>ハッシュタグ ※間に空白が必須</label>
<div style="font-size: 12px; color: gray; margin-bottom: 5px;">
  格安 お得 ぼっち旅 女ひとり旅 一人旅
</div>
<textarea id="hashtag" placeholder="ハッシュタグを入力"></textarea>

<label>関連動画</label>
<div style="font-size: 12px; color: gray; margin-bottom: 5px;">
  ▼この動画の前編はこちら<br>
  https://youtu.be/9wQKzBq3-sI?si=5AbfzoXrwk2uwnYN
</div>
<textarea id="field1" placeholder="関連動画を入力"></textarea>

<label>フリーテキスト（日本語）</label>
<div style="font-size: 12px; color: gray; margin-bottom: 5px;">
  サンライズ出雲 倉敷駅 22:14 → 東京駅 翌7:08
</div>
<textarea id="field2" placeholder="フリーテキストを入力"></textarea>

<label>見出し</label>
<table id="chaptersTable" style="width:100%; margin-bottom:15px; border-collapse: collapse;">
  <thead>
    <tr>
      <th>timestamp</th>
      <th>日本語</th>
      <th>English</th>
    </tr>
  </thead>
  <tbody>
    <tr><td><input value="0:00"></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td></tr>
  </tbody>
</table>

<label>♬*.:*¸¸bgm</label>
<textarea id="field3" placeholder="BGM YouTubeリンクを入力"></textarea>
<div id="bgmLinks"></div>

<label class="checkbox-label line-break">
  <input type="checkbox" id="englishCC"> english cc available
</label>

<label>フリーテキスト（英語）</label>
<div style="font-size: 12px; color: gray; margin-bottom: 5px;">
  in this vlog: art basel hong kong, art central, HKWALLS 2026 @ PMQ
</div>
<textarea id="fieldEn" placeholder="フリーテキストを入力"></textarea>

<button onclick="generateText()">作成</button>

<h3>説明文</h3>
<div id="output"></div>
<br>
<button id="copyJpBtn" onclick="copyJapanese()">コピー</button>

<h3>ハッシュタグ</h3>
<div id="hashtagsOutput"></div>
<br>
<button id="copyHashtagsBtn" onclick="copyHashtags()">コピー</button>

<h3>English description</h3>
<div id="outputEn"></div>
<br>
<button id="copyEnBtn" onclick="copyEnglish()">Copy</button>

<script>
function generateText() {
  const tagInput = document.getElementById("hashtag").value.trim();
  const f1 = document.getElementById("field1").value.trim();
  const f2 = document.getElementById("field2").value.trim();
  const fEn = document.getElementById("fieldEn").value.trim();
  const f3 = document.getElementById("field3").value.trim();
  const englishCC = document.getElementById("englishCC").checked;

  // chapters
  const rows = document.querySelectorAll("#chaptersTable tbody tr");
  let chaptersJp = "";
  let chaptersEn = "";

  rows.forEach(row => {
    const cells = row.querySelectorAll("input");
    const time = cells[0].value.trim();
    const jp = cells[1].value.trim();
    const en = cells[2].value.trim();

    if (time && (jp || en)) {
      if (jp) chaptersJp += `${time} ${jp}\n`;
      if (en) chaptersEn += `${time} ${en}\n`;
    }
  });

  const divider = "┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈";
  const mandatoryTextJp = `ご視聴ありがとうございます。
高評価とチャンネル登録していただければ喜びます♡`;

  // --- Japanese description ---
  let resultJp = "";
  if (f1) resultJp += f1 + "\n" + divider + "\n";

  if (f2) {
    resultJp += f2 + "\n";
    if (chaptersJp) resultJp += divider + "\n" + chaptersJp + divider + "\n";
  }

  resultJp += mandatoryTextJp + "\n\n";
  resultJp += "♬*.:*¸¸bgm\n" + f3 + "\n";

  // hashtags
  let hashtagsCommaSeparated = "";
  if (tagInput) {
    const hashtags = tagInput.split(/\s|　/g).filter(t => t.length > 0);
    const hashForDesc = hashtags.map(t => "#" + t).join(" ");
    resultJp += "\n" + hashForDesc;
    hashtagsCommaSeparated = hashtags.join(", ");
  }

  // --- English description ---
  let resultEn = "";
  if (englishCC) {
    resultEn += "english cc is available on this video. turn it on if you'd like english subtitles :)\n";
  }

  if (chaptersEn) resultEn += divider + "\n" + chaptersEn + divider + "\n";

  const mandatoryTextEn = "thank you for watching - please like and subscribe for more 💛";
  resultEn += mandatoryTextEn + "\n\n";
  resultEn += "♬*.:*¸¸bgm\n" + f3 + "\n\n";

  if (fEn) resultEn += fEn + "\n";

  document.getElementById("output").textContent = resultJp;
  document.getElementById("outputEn").textContent = resultEn;
  document.getElementById("hashtagsOutput").textContent = hashtagsCommaSeparated;
}

// copy
function showCheckmark(button) {
  const originalText = button.textContent;
  button.textContent = "✓";
  setTimeout(() => button.textContent = originalText, 1000);
}

function copyJapanese() {
  const output = document.getElementById("output").textContent;
  if (!output) return;
  navigator.clipboard.writeText(output).then(() => showCheckmark(document.getElementById("copyJpBtn")));
}
function copyEnglish() {
  const outputEn = document.getElementById("outputEn").textContent;
  if (!outputEn) return;
  navigator.clipboard.writeText(outputEn).then(() => showCheckmark(document.getElementById("copyEnBtn")));
}
function copyHashtags() {
  const hashtags = document.getElementById("hashtagsOutput").textContent;
  if (!hashtags) return;
  navigator.clipboard.writeText(hashtags).then(() => showCheckmark(document.getElementById("copyHashtagsBtn")));
}

// YouTube title links
document.getElementById("field3").addEventListener("input", async () => {
  const value = document.getElementById("field3").value;
  const linksDiv = document.getElementById("bgmLinks");
  linksDiv.innerHTML = "";

  const urls = value.match(/https?:\/\/\S+/g);
  if (!urls) return;

  for (const url of urls) {
    let videoUrl = url;

    if (url.includes("youtu.be/")) {
      const id = url.split("youtu.be/")[1].split(/[?&]/)[0];
      videoUrl = `https://www.youtube.com/watch?v=${id}`;
    }

    try {
      const res = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(videoUrl)}&format=json`);
      const data = await res.json();

      const a = document.createElement("a");
      a.href = videoUrl;
      a.target = "_blank";
      a.textContent = data.title;
      a.style.display = "block";
      a.style.marginBottom = "5px";

      linksDiv.appendChild(a);
    } catch {
      const a = document.createElement("a");
      a.href = videoUrl;
      a.target = "_blank";
      a.textContent = videoUrl;
      a.style.display = "block";
      linksDiv.appendChild(a);
    }
  }
});
</script>

</body>
</html>
