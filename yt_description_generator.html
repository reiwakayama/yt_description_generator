<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTube説明文ジェネレーター</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    textarea {
      width: 100%;
      height: 80px;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 15px; 
      width: 75px;    
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
      text-align: center;
    }
    #output, #hashtagsOutput, #outputEn, #bgmLinks {
      white-space: pre-wrap;
      margin-top: 20px;
      background: #f5f5f5;
      padding: 15px;
    }
    #bgmLinks a {
      display: block;
      color: #065fd4;
      text-decoration: underline;
      margin-bottom: 3px;
    }
    label.checkbox-label {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      font-weight: normal;
    }
    label.checkbox-label input {
      margin-right: 10px;
    }
    #bgmLinks {
      margin-top: 0; /* remove extra space above */
      margin-bottom: 10px; /* space before checkbox */
    }
  </style>
</head>
<body>

<h2>YouTube説明文ジェネレーター</h2>

<label>ハッシュタグ ※間に空白が必須</label>
<div style="font-size: 12px; color: gray; margin-bottom: 5px;">
  格安 お得 ぼっち旅 女ひとり旅 一人旅
</div>
<textarea id="hashtag" placeholder="ハッシュタグを入力"></textarea>

<label>関連動画</label>
<div style="font-size: 12px; color: gray; margin-bottom: 5px;">
  ▼この動画の前編はこちら<br>
  https://youtu.be/9wQKzBq3-sI?si=5AbfzoXrwk2uwnYN
</div>
<textarea id="field1" placeholder="関連動画を入力"></textarea>

<label>フリーテキスト（日本語）</label>
<div style="font-size: 12px; color: gray; margin-bottom: 5px;">
  サンライズ出雲 倉敷駅 22:14 → 東京駅 翌7:08
</div>
<textarea id="field2" placeholder="フリーテキストを入力"></textarea>

<label>♬*.:*¸¸bgm</label>
<textarea id="field3" placeholder="bgmを入力"></textarea>
<div id="bgmLinks"></div>

<label class="checkbox-label">
  <input type="checkbox" id="englishCC"> english cc available
</label>

<label>フリーテキスト（英語）</label>
<div style="font-size: 12px; color: gray; margin-bottom: 5px;">
  in this vlog: art basel hong kong, art central, HKWALLS 2026 @ PMQ
</div>
<textarea id="fieldEn" placeholder="フリーテキストを入力"></textarea>

<button onclick="generateText()">作成</button>

<h3>説明文</h3>
<div id="output"></div>
<br>
<button onclick="copyJapanese()">コピー</button>

<h3>ハッシュタグ</h3>
<div id="hashtagsOutput"></div>
<br>
<button onclick="copyHashtags()">コピー</button>

<h3>English description</h3>
<div id="outputEn"></div>
<br>
<button onclick="copyEnglish()">Copy</button>

<script>
// Function to update clickable BGM links as the user types
async function updateBgmLinks() {
  const bgmText = document.getElementById("field3").value.trim();
  const bgmLinksDiv = document.getElementById("bgmLinks");
  bgmLinksDiv.innerHTML = ""; // clear previous

  if (!bgmText) return;

  const urls = bgmText.match(/https?:\/\/(www\.)?youtu(be\.com|\.be)\/[^\s]+/g);
  if (!urls) return;

  for (const url of urls) {
    try {
      const oembedUrl = `https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`;
      const response = await fetch(oembedUrl);
      let title;
      if (response.ok) {
        const data = await response.json();
        title = data.title;
      } else {
        title = url;
      }
      const a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.textContent = title;
      bgmLinksDiv.appendChild(a);
    } catch (err) {
      const a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.textContent = url;
      bgmLinksDiv.appendChild(a);
    }
  }
}

// Listen for input changes in BGM textarea
document.getElementById("field3").addEventListener("input", updateBgmLinks);

// Generate full description (same as before)
function generateText() {
  const tagInput = document.getElementById("hashtag").value.trim();
  const f1 = document.getElementById("field1").value.trim();
  const f2 = document.getElementById("field2").value.trim();
  const fEn = document.getElementById("fieldEn").value.trim();
  const f3 = document.getElementById("field3").value.trim();
  const englishCC = document.getElementById("englishCC").checked;

  const divider = "┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈";
  const mandatoryText = `ご視聴ありがとうございます。
高評価とチャンネル登録していただければ喜びます♡`;

  let resultJp = "";
  if (f1) resultJp += f1 + "\n" + divider + "\n";
  if (f2) resultJp += f2 + "\n" + divider + "\n";
  resultJp += mandatoryText + "\n\n";
  resultJp += "♬*.:*¸¸bgm\n" + f3 + "\n";

  let hashtagsCommaSeparated = "";
  if (tagInput) {
    const hashtags = tagInput.split(/\s|　/g).filter(t => t.length > 0);
    resultJp += "\n" + hashtags.map(t => "#" + t).join(" ");
    hashtagsCommaSeparated = hashtags.join(", ");
  }

  let resultEn = "";
  if (englishCC) resultEn += "english cc is available on this video. turn it on if you'd like english subtitles :)\n\n" + divider + "\n";
  const mandatoryTextEn = "thank you for watching - please like and subscribe for more 💛 ";
  resultEn += mandatoryTextEn + "\n\n";
  resultEn += "♬*.:*¸¸bgm\n" + f3 + "\n\n";
  if (fEn) resultEn += fEn + "\n";

  document.getElementById("output").textContent = resultJp;
  document.getElementById("outputEn").textContent = resultEn;
  document.getElementById("hashtagsOutput").textContent = hashtagsCommaSeparated;
}

// Copy functions
function copyJapanese() {
  const output = document.getElementById("output").textContent;
  if (!output) return alert("説明文がありません");
  navigator.clipboard.writeText(output).then(() => alert("説明文をコピーしました"));
}

function copyEnglish() {
  const outputEn = document.getElementById("outputEn").textContent;
  if (!outputEn) return alert("No English description");
  navigator.clipboard.writeText(outputEn).then(() => alert("Copied English description"));
}

function copyHashtags() {
  const hashtags = document.getElementById("hashtagsOutput").textContent;
  if (!hashtags) return alert("ハッシュタグがありません");
  navigator.clipboard.writeText(hashtags).then(() => alert("ハッシュタグをコピーしました"));
}
</script>

</body>
</html>
